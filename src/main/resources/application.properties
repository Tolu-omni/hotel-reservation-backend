spring.application.name=hotel-reservation
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_reservation}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=https://api.paystack.co
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
google.client-id=${GOOGLE_CLIENT_ID:}
