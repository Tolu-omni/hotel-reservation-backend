spring.application.name=hotel-reservation
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_reservation}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=https://api.paystack.co
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
google.client-id=${GOOGLE_CLIENT_ID:}
nova.allowed-origins=${FRONTEND_BASE_URL:http://localhost:3000},http://localhost:3100
