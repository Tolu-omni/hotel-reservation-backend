spring.datasource.url=jdbc:h2:mem:nova_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET:test-only-jwt-secret-for-automated-tests}
jwt.expiration=3600000
paystack.secret-key=${PAYSTACK_SECRET_KEY:test-only-paystack-placeholder}
paystack.base-url=http://127.0.0.1:1
frontend.base-url=http://localhost:3100
google.client-id=${GOOGLE_CLIENT_ID:}
nova.mail-mode=capture
logging.level.root=WARN
