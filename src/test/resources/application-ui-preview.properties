server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:mem:nova_preview;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
nova.mail-mode=capture
# Local synthetic preview only. Real Paystack test mode requires an operator-supplied test key.
paystack.secret-key=${PAYSTACK_SECRET_KEY:test-only-paystack-placeholder}
